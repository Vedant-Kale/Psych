name: Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    # Fork PRs never get secrets; skip them instead of failing.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Skip until Cloudflare secrets exist
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN not set; deploy skipped"
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v7
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Fail if SITE_URL is unset
        if: env.CLOUDFLARE_API_TOKEN != '' && env.SITE_URL == ''
        run: echo "::error::Set the repo variable SITE_URL (canonical site origin) before deploying" && exit 1
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci && npm run build
      - name: Apply D1 migrations
        if: env.CLOUDFLARE_API_TOKEN != '' && github.event_name == 'push'
        run: npx wrangler d1 migrations apply psych --remote
      - name: Production deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && github.event_name == 'push'
        run: npx wrangler deploy
      - name: Preview version
        if: env.CLOUDFLARE_API_TOKEN != '' && github.event_name == 'pull_request'
        env:
          # Passed via env, not inlined: an unquoted ` #` in YAML starts a comment, and inlining expressions into shell is an injection risk.
          PR_NUMBER: ${{ github.event.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx wrangler versions upload --message "PR ${PR_NUMBER} ${HEAD_SHA}"
